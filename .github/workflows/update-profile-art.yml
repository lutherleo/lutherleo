name: Update profile art

# Refreshes the contribution graph + stats card SVGs daily from real data.
# Runs daily, on every push to main, and on demand.

"on":
  schedule:
    - cron: "17 6 * * *"   # ~06:17 UTC every day
  workflow_dispatch: {}
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  art:
    runs-on: ubuntu-latest
    env:
      GH_PROFILE_USER: ${{ github.repository_owner }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Scrape real contribution data (no auth, stdlib only)
        run: python scripts/fetch_contributions.py

      - name: Render animated contribution graph
        run: python scripts/render_heatmap_svg.py

      - name: Render streak / numbers card
        run: python scripts/render_stats_svg.py

      - name: Commit updated art
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: refresh contribution graph [skip ci]"
          file_pattern: "data/contributions.json assets/contrib-heatmap.svg assets/stats.svg"
